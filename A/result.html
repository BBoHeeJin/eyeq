  <main class="a-view">
    <div class="a-canvas a-res" data-result>
      <div class="a-res__row">
        <div class="a-ptitle">
          <p class="a-ptitle__eyebrow">TYPOGRAPHY · BASIC RESULT</p>
          <h1 class="a-ptitle__h">나의 <em>타이포그래피</em> 감각은?</h1>
          <p class="a-ptitle__sub">3개의 문제를 통해 확인한 디자인 감각 결과예요.</p>
        </div>
      </div>
      <div class="a-res__body">
        <!-- Result / Score Summary (191:1703 · 213:2022) -->
        <section class="a-score" aria-labelledby="a-score-h">
          <div class="a-score__text">
            <p class="a-score__eyebrow">YOUR RESULT</p>
            <h2 class="a-score__h" id="a-score-h" data-score-h></h2>
            <p class="a-score__fb" data-score-fb></p>
            <p class="a-score__count" data-score-count></p>
          </div>
          <div class="a-score__ring">
            <svg viewBox="0 0 220 220" aria-hidden="true"><circle class="a-ring__track" cx="110" cy="110" r="101.75" /><circle class="a-ring__val" cx="110" cy="110" r="101.75" data-ring /></svg>
            <p class="a-score__num"><b data-score-num></b><span>/ 100</span></p>
          </div>
        </section>
        <section class="a-res__qs" aria-labelledby="a-res-qs">
          <div class="a-res__qhead">
            <h2 class="a-res__h2" id="a-res-qs">문제별 결과</h2>
            <p class="a-res__h2sub">내가 고른 답과 정답을 비교해보세요.</p>
          </div>
          <div class="a-res__cards">
          <article class="a-rq" data-rq="1">
            <div class="a-rq__row">
              <h3 class="a-rq__title"><span class="a-rq__no">Q1</span>서체 선택</h3>
              <span class="a-rq__badge" data-rq-badge></span>
            </div>
            <div class="a-rq__row">
              <p class="a-rq__ans"><span>선택 <b data-rq-pick></b></span><i aria-hidden="true"></i><span>정답 <b data-rq-answer></b></span></p>
              <button class="a-rq__more" type="button" data-soon aria-haspopup="dialog" data-soon-msg="문제별 해설을 준비하고 있어요.">해설 보기<svg class="a-mi" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false"><g> <path d="M2.99999 9.00027H14.25M9.74999 4.12527L14.625 9.00027L9.74999 13.8753" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/> </g></svg></button>
            </div>
          </article>
          <article class="a-rq" data-rq="2">
            <div class="a-rq__row">
              <h3 class="a-rq__title"><span class="a-rq__no">Q2</span>글자 크기</h3>
              <span class="a-rq__badge" data-rq-badge></span>
            </div>
            <div class="a-rq__row">
              <p class="a-rq__ans"><span>선택 <b data-rq-pick></b></span><i aria-hidden="true"></i><span>정답 <b data-rq-answer></b></span></p>
              <button class="a-rq__more" type="button" data-soon aria-haspopup="dialog" data-soon-msg="문제별 해설을 준비하고 있어요.">해설 보기<svg class="a-mi" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false"><g> <path d="M2.99999 9.00027H14.25M9.74999 4.12527L14.625 9.00027L9.74999 13.8753" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/> </g></svg></button>
            </div>
          </article>
          <article class="a-rq" data-rq="3">
            <div class="a-rq__row">
              <h3 class="a-rq__title"><span class="a-rq__no">Q3</span>자간 비교</h3>
              <span class="a-rq__badge" data-rq-badge></span>
            </div>
            <div class="a-rq__row">
              <p class="a-rq__ans"><span>선택 <b data-rq-pick></b></span><i aria-hidden="true"></i><span>정답 <b data-rq-answer></b></span></p>
              <button class="a-rq__more" type="button" data-soon aria-haspopup="dialog" data-soon-msg="문제별 해설을 준비하고 있어요.">해설 보기<svg class="a-mi" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false"><g> <path d="M2.99999 9.00027H14.25M9.74999 4.12527L14.625 9.00027L9.74999 13.8753" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/> </g></svg></button>
            </div>
          </article>
          </div>
        </section>
        <div class="a-res__btns">
          <a class="a-btn a-btn--tint" href="test-basic.html" data-retry>다시 테스트하기<svg class="a-mi" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false"><g> <path d="M3 9H14.25M9.75 4.125L14.625 9L9.75 13.875" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/> </g></svg></a>
          <a class="a-btn a-btn--primary" href="category.html">다른 감각 테스트<svg class="a-mi" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false"><g> <path d="M2.99999 9.00027H14.25M9.74999 4.12527L14.625 9.00027L9.74999 13.8753" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/> </g></svg></a>
