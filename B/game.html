<!doctype html>
<html lang="ko" class="b-page-game">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EYEQ — Typography 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <!-- 스크립트가 헤더·카드 내용을 채운 뒤 첫 화면을 그림 (페이지 이동 시 깜빡임 방지, 지원 브라우저만) -->
  <link rel="expect" href="#b-ready" blocking="render" />
  <link rel="stylesheet" href="css/b-tokens.css" />
  <link rel="stylesheet" href="css/b-common.css" />
  <link rel="stylesheet" href="css/b-game.css" />
</head>
<body class="b-page">
  <!-- 배경: PC 360:8127 / Mobile 360:8220 -->
  <div class="b-bg b-bg--game" aria-hidden="true">
    <img class="b-bg__img b-bg__img--pc" src="assets/b/bg-game-pc.svg" alt="" />
    <div class="b-bg__mo">
      <img class="b-bg__glow" src="assets/b/top-glow-mobile.svg" alt="" />
      <span class="b-cube" style="--x:-24.38;--y:-31.25;--s:74;--rot:-18deg;--o:.55"></span>
      <span class="b-cube" style="--x:342.25;--y:173.34;--s:62;--rot:16deg;--o:.7"></span>
      <span class="b-cube" style="--x:324.79;--y:182.55;--s:30;--rot:-12deg;--o:.8;--b:0px"></span>
      <span class="b-cube" style="--x:-33.97;--y:304.84;--s:52;--rot:12deg;--o:.45"></span>
      <span class="b-cube" style="--x:365.89;--y:458.74;--s:56;--rot:-20deg;--o:.5"></span>
      <span class="b-cube" style="--x:-23.21;--y:611.31;--s:64;--rot:-14deg;--o:.45"></span>
      <span class="b-cube" style="--x:345.26;--y:767.8;--s:60;--rot:18deg;--o:.5"></span>
      <span class="b-bg__vignette"></span>
    </div>
  </div>

  <!-- ===== Header — Character Selected (313:3575 / Mobile 349:7179) ===== -->
  <header class="b-header b-header--selected" data-header>
    <a class="b-header__logo" href="index.html" aria-label="EYEQ 홈">
      <img class="b-header__logo-img b-header__logo-img--pc" src="assets/b/logo-eyeq.svg" alt="EYEQ" />
      <img class="b-header__logo-img b-header__logo-img--mo" src="assets/b/logo-eyeq-mobile.svg" alt="EYEQ" />
    </a>
    <nav class="b-nav" aria-label="주요 메뉴">
      <a class="b-nav__item" href="index.html">
        <span class="b-nav__label">Home</span><span class="b-nav__bar" aria-hidden="true"></span>
      </a>
      <a class="b-nav__item is-active" href="stage.html" aria-current="page">
        <span class="b-nav__label">Game</span><span class="b-nav__bar" aria-hidden="true"></span>
      </a>
      <!-- Ranking · About: 기획·시안 없음 → Coming Soon 팝업 -->
      <a class="b-nav__item" href="#" data-coming-soon aria-haspopup="dialog">
        <span class="b-nav__label">Ranking</span><span class="b-nav__bar" aria-hidden="true"></span>
      </a>
      <a class="b-nav__item" href="#" data-coming-soon aria-haspopup="dialog">
        <span class="b-nav__label">About</span><span class="b-nav__bar" aria-hidden="true"></span>
      </a>
    </nav>
    <div class="b-header__actions">
      <div class="b-charinfo" data-charinfo role="img" aria-label="선택한 캐릭터">
        <span class="b-charinfo__profile"><img data-char-img src="assets/b/char-eye.png" alt="" /></span>
        <span class="b-charinfo__level">
          <span class="b-charinfo__lv" data-lv-text>LV. 01</span>
          <span class="b-charinfo__xp" data-xp-text>XP 0 / 100</span>
          <span class="b-charinfo__bar"><span class="b-charinfo__fill"></span></span>
        </span>
        <span class="b-charinfo__divider" aria-hidden="true"></span>
      </div>
      <button class="b-header__icon-btn b-header__icon-btn--bell" type="button" aria-label="알림" data-coming-soon aria-haspopup="dialog">
        <img class="b-icon--pc" src="assets/b/icon-notification.svg" alt="" />
        <img class="b-icon--mo" src="assets/b/icon-notification-mobile.svg" alt="" />
      </button>
      <button class="b-header__icon-btn b-header__icon-btn--profile" type="button" aria-label="프로필" data-coming-soon aria-haspopup="dialog">
        <img src="assets/b/icon-profile.svg" alt="" />
      </button>
      <button class="b-header__icon-btn b-header__menu-btn" type="button" aria-label="메뉴 열기"
              aria-controls="b-menu" aria-expanded="false" data-menu-toggle>
        <img class="b-header__menu-icon b-header__menu-icon--open" src="assets/b/icon-menu.svg" alt="" />
        <img class="b-header__menu-icon b-header__menu-icon--close" src="assets/b/icon-close.svg" alt="" />
      </button>
    </div>
  </header>

  <!-- 모바일 메뉴 — Closed Selected / Open Selected (349:7179) : Game 활성 -->
  <div class="b-menu" id="b-menu" data-menu aria-hidden="true">
    <div class="b-menu__scrim" data-menu-close></div>
    <nav class="b-menu__panel" aria-label="모바일 메뉴">
      <p class="b-menu__label">MENU</p>
      <a class="b-menu__item" href="index.html"><span class="b-menu__bar" aria-hidden="true"></span><span>Home</span></a>
      <a class="b-menu__item is-active" href="stage.html" aria-current="page"><span class="b-menu__bar" aria-hidden="true"></span><span>Game</span></a>
      <a class="b-menu__item" href="#" data-coming-soon aria-haspopup="dialog"><span class="b-menu__bar" aria-hidden="true"></span><span>Ranking</span></a>
      <a class="b-menu__item" href="#" data-coming-soon aria-haspopup="dialog"><span class="b-menu__bar" aria-hidden="true"></span><span>About</span></a>
    </nav>
  </div>

  <!-- ===== GAME PLAY (PC 360:8126 · Game Board 330:6486 / Mobile 360:8213) ===== -->
  <main class="b-main b-view">
    <div class="b-canvas b-game" data-game>
      <p class="b-sr-only">STAGE 01 Typography</p>

      <!-- Level Card (PC) — 헤더 캐릭터 정보를 크게 옮김 (사용자 요청) · 모바일은 헤더에 그대로 -->
      <div class="b-glevel" data-charinfo role="img" aria-label="선택한 캐릭터">
        <span class="b-glevel__profile"><img data-char-img src="assets/b/char-eye.png" alt="" /></span>
        <span class="b-glevel__info">
          <span class="b-glevel__row"><span class="b-glevel__lv" data-lv-text>LV. 01</span><span class="b-glevel__xp" data-xp-text>XP 0 / 100</span></span>
          <span class="b-glevel__bar"><span class="b-glevel__fill"></span></span>
        </span>
      </div>

      <!-- Mission Progress (326:4311) -->
      <div class="b-progress" data-progress aria-hidden="true">
        <span class="b-progress__track"></span>
        <span class="b-progress__fill"></span>
        <span class="b-pnode" data-node="1">
          <img class="b-pnode__ring b-pc" src="assets/b/progress-node-current.svg" alt="" />
          <img class="b-pnode__ring b-mo" src="assets/b/progress-node-current-mobile.svg" alt="" />
          <img class="b-pnode__check b-pc" src="assets/b/progress-check.svg" alt="" />
          <img class="b-pnode__check b-mo" src="assets/b/progress-check-mobile.svg" alt="" />
        </span>
        <span class="b-pnode" data-node="2">
          <img class="b-pnode__ring b-pc" src="assets/b/progress-node-current.svg" alt="" />
          <img class="b-pnode__ring b-mo" src="assets/b/progress-node-current-mobile.svg" alt="" />
          <img class="b-pnode__check b-pc" src="assets/b/progress-check.svg" alt="" />
          <img class="b-pnode__check b-mo" src="assets/b/progress-check-mobile.svg" alt="" />
        </span>
        <span class="b-pnode" data-node="3">
          <img class="b-pnode__ring b-pc" src="assets/b/progress-node-current.svg" alt="" />
          <img class="b-pnode__ring b-mo" src="assets/b/progress-node-current-mobile.svg" alt="" />
          <img class="b-pnode__check b-pc" src="assets/b/progress-check.svg" alt="" />
          <img class="b-pnode__check b-mo" src="assets/b/progress-check-mobile.svg" alt="" />
        </span>
        <span class="b-plabel" data-label="1">01</span>
        <span class="b-plabel" data-label="2">02</span>
        <span class="b-plabel" data-label="3">03</span>
      </div>

      <!-- Mission Badge (358:8050) -->
      <p class="b-mbadge" data-mission-badge>MISSION 01 / 03</p>

      <!-- 문제 타이틀 -->
      <div class="b-gtitle" data-title>
        <h1 class="b-gtitle__h"><em class="b-gtitle__accent">다른 하나</em>를 찾아라!</h1>
        <p class="b-gtitle__desc" data-mission-desc>세 가지 중 글자 간격이 다른 하나를 선택하세요.</p>
      </div>

      <!-- Feedback (327:4448) : 정답 / 오답 / 콤보 -->
      <div class="b-fb" data-feedback hidden>
        <div class="b-fb__msg">
          <div class="b-fb__row">
            <span class="b-fb__title" data-fb-title>GREAT!</span>
            <span class="b-fb__flame" data-fb-flame hidden><img src="assets/b/icon-flame.svg" alt="" /></span>
          </div>
          <div class="b-fb__rewards">
            <span class="b-fb__badge b-fb__badge--combo" data-fb-combo hidden>2 COMBO</span>
            <span class="b-fb__badge b-fb__badge--xp" data-fb-xp>+30 XP</span>
          </div>
        </div>
        <span class="b-fb__react" aria-hidden="true">
          <img data-react-char src="assets/b/char-eye.png" alt="" />
          <img data-react-face src="assets/b/expression-eye-happy.svg" alt="" />
        </span>
        <span class="b-fb__fx" aria-hidden="true">
          <img class="b-fb__sp b-fb__sp--1" src="assets/b/sparkle-1.svg" alt="" />
          <img class="b-fb__sp b-fb__sp--2" src="assets/b/sparkle-2.svg" alt="" />
          <img class="b-fb__sp b-fb__sp--3" src="assets/b/sparkle-3.svg" alt="" />
          <img class="b-fb__sp b-fb__sp--4" src="assets/b/sparkle-4.svg" alt="" />
          <img class="b-fb__sp b-fb__sp--5" src="assets/b/sparkle-5.svg" alt="" />
          <img class="b-fb__sp b-fb__sp--w" src="assets/b/sparkle-wrong.svg" alt="" />
        </span>
      </div>

      <!-- Answer Cards A / B / C (326:4385) -->
      <div class="b-answers" role="radiogroup" aria-label="답안 선택">
        <button class="b-ans" type="button" role="radio" aria-checked="false" data-letter="A"></button>
        <button class="b-ans" type="button" role="radio" aria-checked="false" data-letter="B"></button>
        <button class="b-ans" type="button" role="radio" aria-checked="false" data-letter="C"></button>
      </div>

      <!-- Back (STAGE SELECT) + Game Button -->
      <div class="b-gactions">
        <a class="b-back" href="stage.html" aria-label="스테이지 선택으로 돌아가기"><img src="assets/b/icon-arrow-left.svg" alt="" /></a>
        <button class="b-gbtn" type="button" data-action disabled>정답 확인하기 →</button>
      </div>
      <p class="b-sr-only" aria-live="polite" data-live></p>
    </div>
  </main>

  <script src="js/b-common.js"></script>
  <script src="js/b-game.js"></script>
  <span id="b-ready" hidden></span>
</body>
</html>
