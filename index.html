      <form class="b-nick__form" data-nick-form novalidate>
        <span class="b-nick__field">
          <svg class="b-nick__user" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c.9-3.6 3.8-5.5 7.5-5.5s6.6 1.9 7.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input class="b-nick__input" type="text" maxlength="12" placeholder="닉네임을 입력해주세요" aria-label="닉네임 (최대 12자)" aria-describedby="b-nick-hint" autocomplete="off" spellcheck="false" data-nick-input />
          <span class="b-nick__count" data-nick-count aria-hidden="true">0 / 12</span>
        </span>
        <p class="b-nick__hint" id="b-nick-hint" aria-live="polite"><svg class="b-nick__info" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 10.5v6" stroke="#1c1e5c" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.3" r="1.4" fill="#1c1e5c"/></svg><span data-nick-hint>최대 12자 · 나중에 변경할 수 있어요.</span></p>
        <!-- 디자인 전공 여부 (필수 · 둘 중 하나) — 통계용으로 프로필에 함께 저장 -->
        <fieldset class="b-major" data-major>
          <legend class="b-major__q">디자인을 전공하셨나요?</legend>
          <span class="b-major__opts">
            <label class="b-major__opt"><input type="radio" name="b-major" value="design" data-major-input /><span>디자인 전공자</span></label>
            <label class="b-major__opt"><input type="radio" name="b-major" value="non_design" data-major-input /><span>비전공자</span></label>
          </span>
        </fieldset>
        <button class="b-modal__btn b-modal__btn--confirm b-nick__start" type="submit" data-nick-start disabled>EYEQ 시작하기 →</button>
      </form>
    </div>
  </div>

  <script src="js/b-main.js"></script><!-- 캐릭터 카드 상태를 먼저 그림 (뒤 스크립트를 기다리다 카드 크기가 바뀌어 보이는 것 방지) -->
  <script src="js/b-online.js"></script>
  <script src="js/b-presence.js"></script>
  <script src="js/b-achieve.js"></script>
  <script src="js/b-skins.js"></script>
  <script src="js/b-tutorial.js"></script>
  <script src="js/b-feedback.js"></script>
  <span id="b-ready" hidden></span>
</body>
